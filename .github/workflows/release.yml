name: Make Release
run-name: Make Release
on:
    workflow_call:
        outputs:
            RELEASE_TAG:
                description: The tag of the new release
                value: ${{ jobs.semantic-release.outputs.RELEASE_TAG }}
jobs:
    semantic-release:
        name: Semantic Release
        runs-on: ubuntu-latest
        permissions: write-all
        outputs:
            RELEASE_TAG: ${{ steps.semantic.outputs.new_release_version }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4.1.0
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                node-version: "lts/*"
            - name: Semantic Release
              uses: cycjimmy/semantic-release-action@v4.2.0
              id: semantic
              with:
                semantic_version: 24.2.3
                branches: |
                    [
                        '+([0-9])?(.{+([0-9]),x}).x',
                        'main',
                        {
                            name: 'alpha',
                            prerelease: true
                        }
                    ]
                extra_plugins: |
                    @semantic-release/commit-analyzer
                    @semantic-release/release-notes-generator
                    @semantic-release/github
                    @semantic-release/changelog
                    @semantic-release/git
